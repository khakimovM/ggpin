services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ggpin
      POSTGRES_PASSWORD: ggpin
      POSTGRES_DB: ggpin
    ports: ["127.0.0.1:5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ggpin"]
      interval: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:6379:6379"]
    volumes: [redisdata:/data]
volumes:
  pgdata:
  redisdata:
