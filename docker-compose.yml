services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ggpin
      POSTGRES_PASSWORD: ggpin
      POSTGRES_DB: ggpin
    # Host port 5433: a local Windows PostgreSQL service commonly holds 5432.
    ports: ['127.0.0.1:5433:5432']
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ggpin']
      interval: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    ports: ['127.0.0.1:6379:6379']
    volumes: [redisdata:/data]
volumes:
  pgdata:
  redisdata:
