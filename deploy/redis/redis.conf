# Redis 7 for ggpin production (deploy/compose.prod.yml, service `redis`). BullMQ queues (fulfill-order,
# tg-outbox, bank-feed jobs), wallet balance cache, rate-limit counters, locks and the worker heartbeat.
# Reachable only on the internal `data` network; no published port.

# ---- Network ----------------------------------------------------------------------------------------
bind * -::*
port 6379
# Stays on: Redis refuses outside clients if the default user ever ends up without a password.
protected-mode yes
tcp-keepalive 300
timeout 0

# ---- Users ------------------------------------------------------------------------------------------
# Users and SHA-256 password hashes come from the Docker secret (deploy/env/redis-users.acl.example):
# default user off, one user per service (api, worker, bankfeed), a PING-only `healthcheck` user.
# No requirepass here: with an aclfile every user, the default one included, is defined there.
aclfile /run/secrets/redis_users_acl
# ACL LOG keeps the last denied commands/logins for `ACL LOG` (ops debugging).
acllog-max-len 128

# ---- Persistence (BullMQ must not lose jobs, docs/13) ----------------------------------------------
dir /data
appendonly yes
appendfilename "appendonly.aof"
appenddirname "appendonlydir"
# At most ~1 s of writes can be lost on a host crash; queue state is re-derived from Postgres
# by the reconcilers (orders, payments), never from Redis alone.
appendfsync everysec
aof-use-rdb-preamble yes
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb
# RDB snapshots as well: a second copy the P11-S9 backup can pick up.
save 3600 1 300 100 60 10000
stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes
dbfilename dump.rdb

# ---- Memory -----------------------------------------------------------------------------------------
# Container limit 512m (compose). maxmemory is half of it: an AOF rewrite or BGSAVE forks the process,
# and under write load copy-on-write can duplicate most of the dataset; the other half is for that fork,
# client buffers and allocator overhead, so the kernel OOM killer never hits Redis mid-rewrite.
maxmemory 256mb
# Never evict: an evicted BullMQ key is a lost or duplicated job (docs/13). A full Redis fails writes
# loudly (OOM error) instead; the owner alert fires on queue/health errors.
maxmemory-policy noeviction

# ---- Hardening --------------------------------------------------------------------------------------
enable-debug-command no
enable-module-command no
enable-protected-configs no
# No CONFIG REWRITE target is writable (read-only config mount) — keep it that way.

# ---- Logging ----------------------------------------------------------------------------------------
loglevel notice
logfile ""
