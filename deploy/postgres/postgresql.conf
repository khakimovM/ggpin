# PostgreSQL 16 for ggpin production (deploy/compose.prod.yml, service `postgres`).
# Loaded with `-c config_file=...`; data_directory stays PGDATA and pg_hba.conf stays the one initdb
# wrote there (the official image adds `host all all all scram-sha-256`).
# Sized for KVM 2 (2 vCPU / 8 GB, postgres container limit 1536m) and a small OLTP database.

# ---- Connections ------------------------------------------------------------------------------------
# Internal `data` network only (no published port); TLS is not used inside the host.
listen_addresses = '*'
port = 5432
# api + worker + bankfeed Prisma pools + migrate/backup/ops sessions, with room to spare.
max_connections = 100
superuser_reserved_connections = 3
password_encryption = scram-sha-256
unix_socket_directories = '/var/run/postgresql'
tcp_keepalives_idle = 60

# ---- Memory -----------------------------------------------------------------------------------------
shared_buffers = 384MB
effective_cache_size = 1GB
work_mem = 8MB
maintenance_work_mem = 128MB
huge_pages = off
# /dev/shm is 256m (compose shm_size).
dynamic_shared_memory_type = posix

# ---- Planner (SSD) ----------------------------------------------------------------------------------
random_page_cost = 1.1
effective_io_concurrency = 200

# ---- Parallelism (2 vCPU) ---------------------------------------------------------------------------
max_worker_processes = 4
max_parallel_workers = 2
max_parallel_workers_per_gather = 1
max_parallel_maintenance_workers = 1

# ---- WAL and durability -----------------------------------------------------------------------------
# Money lives here: never trade durability for speed.
fsync = on
synchronous_commit = on
full_page_writes = on
wal_level = replica
wal_compression = on
max_wal_size = 1GB
min_wal_size = 128MB
checkpoint_timeout = 15min
checkpoint_completion_target = 0.9
# P11-S9 (D-73 (8): WAL archive for PITR, RPO <= 5 min) turns archiving on together with the backup
# service; archive_mode needs a restart, archive_command/archive_timeout only a reload.
archive_mode = off
#archive_command = ''
#archive_timeout = 300

# ---- Safety timeouts --------------------------------------------------------------------------------
# A transaction left open by a crashed client must not hold the wallet-row locks forever.
idle_in_transaction_session_timeout = 10min
lock_timeout = 0
statement_timeout = 0

# ---- Logging (stderr -> Docker local log driver) ----------------------------------------------------
log_destination = 'stderr'
logging_collector = off
log_min_messages = warning
log_min_error_statement = error
log_min_duration_statement = 1000
log_checkpoints = on
# Who connected from where (user, database, client address; never a password): audit trail for the
# runtime roles and for anything unexpected on the data networks. Disconnections stay off (noise).
log_connections = on
log_disconnections = off
log_lock_waits = on
log_temp_files = 0
log_autovacuum_min_duration = 10s
log_line_prefix = '%m [%p] %q%u@%d '
# Never write bind parameters (phone numbers, tokens, amounts) into the log.
log_statement = 'none'
log_parameter_max_length = 0
log_parameter_max_length_on_error = 0

# ---- Autovacuum -------------------------------------------------------------------------------------
autovacuum = on
autovacuum_max_workers = 2
autovacuum_naptime = 30s

# ---- Locale / time ----------------------------------------------------------------------------------
timezone = 'UTC'
log_timezone = 'UTC'
datestyle = 'iso, mdy'
lc_messages = 'C'
default_text_search_config = 'pg_catalog.simple'

# ---- Statistics -------------------------------------------------------------------------------------
track_io_timing = on
